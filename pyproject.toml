[project]
name = "minotaurus-ai"
version = "0.0.1"
description = "Train a maze-solving brain with reinforcement learning, then race it online"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165",
    "gymnasium>=1.4.0",
    "jsonschema>=4.26.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "pydantic>=2.14.4",
    "torch>=2.5",
    "typer>=0.29.2",
    "uvicorn>=0.54",
]

[project.scripts]
minotaurus = "minotaurus.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["minotaurus"]

[tool.ruff]
line-length = 100

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
