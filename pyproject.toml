[project]
name = "minotaurus-ai"
version = "0.0.1"
description = "Train a maze-solving brain with reinforcement learning, then race it online"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165",
    "uvicorn>=0.54",
]

[project.scripts]
minotaurus = "minotaurus.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["minotaurus"]

[tool.ruff]
line-length = 100
